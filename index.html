<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>Our Year Wrapped</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Figtree:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-shaped story card centred on a dark stage; each slide is a full-bleed colour field with one big idea. */
:root{
  --stage:#120a14;
  --ink:#1a0d1f;
  --cream:#fff4ea;
  --plum:#3b1252;
  --tangerine:#ff6b3d;
  --cobalt:#2a3fd4;
  --blush:#ffb6c9;
  --butter:#ffd75e;
  --rose:#d6264f;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--stage);color:var(--cream);font-family:var(--body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.stage{height:100%;display:grid;place-items:center;padding-block:12px;box-sizing:border-box}
.phone{position:relative;width:100%;max-width:420px;height:100%;max-height:820px;border-radius:22px;overflow:hidden;background:var(--ink);
  box-shadow:0 30px 80px rgba(0,0,0,.5);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.bars{position:absolute;inset:12px 12px auto;display:flex;gap:4px;z-index:5}
.bar{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--cream)}
.bar.done i{width:100%}
.top{position:absolute;inset:24px 16px auto;display:flex;justify-content:space-between;align-items:center;z-index:5;font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase}
.top button{all:unset;cursor:pointer;padding:6px 8px;border-radius:999px;font:700 12px var(--body);letter-spacing:.06em}
.top button:focus-visible{outline:2px solid var(--cream)}
.tap{position:absolute;top:60px;bottom:0;width:35%;z-index:4;cursor:pointer}
.tap.l{left:0}.tap.r{right:0;width:65%}
.slide{position:absolute;inset:0;padding:78px 26px 34px;display:flex;flex-direction:column;justify-content:center;gap:18px;overflow:hidden}
.slide[hidden]{display:none!important}
.blob{position:absolute;border-radius:50%;pointer-events:none}
.kick{font:700 12px var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.85;position:relative}
h1,h2{font-family:var(--display);margin:0;line-height:1.02;text-wrap:balance;position:relative}
h1{font-size:clamp(34px,10vw,46px);font-weight:900}
h2{font-size:clamp(24px,7vw,30px);font-weight:700}
.big{font:900 clamp(56px,19vw,92px)/.95 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.03em;position:relative}
p{margin:0;font-size:17px;line-height:1.45;max-width:34ch;position:relative}
.sub{font-size:15px;opacity:.85}
.list{display:flex;flex-direction:column;gap:10px;position:relative}
.row{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center}
.row b{font:900 22px var(--display);font-variant-numeric:tabular-nums}
.row span{min-width:0}
.row strong{display:block;font-size:17px}
.row small{opacity:.75;font-size:14px}
.vinyl{width:min(62vw,230px);aspect-ratio:1;max-width:100%;border-radius:50%;position:relative;align-self:center;
  background:repeating-radial-gradient(circle,#111 0 3px,#1d1d1d 3px 5px);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.vinyl::after{content:"";position:absolute;inset:34%;border-radius:50%;background:var(--butter);box-shadow:inset 0 0 0 10px var(--tangerine)}
.spin{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tl{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:18px;border-left:2px solid currentColor}
.tl div{position:relative}
.tl div::before{content:"";position:absolute;left:-25px;top:5px;width:12px;height:12px;border-radius:50%;background:currentColor}
.tl em{display:block;font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;font-style:normal;opacity:.8}
.quote{font:700 clamp(26px,8vw,36px)/1.1 var(--display);position:relative}
.letter{font-size:18px;line-height:1.55;white-space:pre-line;position:relative;max-width:32ch}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;position:relative}
.summary div{min-width:0}
.summary em{display:block;font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;font-style:normal;opacity:.75;margin-bottom:4px}
.summary strong{font:700 16px/1.2 var(--display);word-break:break-word}
.summary .wide{grid-column:1/-1}
.photo{width:100%;max-width:100%;aspect-ratio:4/3;max-height:36vh;object-fit:cover;object-position:center 30%;border-radius:14px;position:relative}
.collage{justify-content:space-between}
.bgphoto{position:absolute;inset:0;width:100%;height:100%;max-width:100%;object-fit:cover;object-position:center 30%}
.veil{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,6,12,.55),rgba(10,6,12,0) 28%,rgba(10,6,12,0) 50%,rgba(10,6,12,.6))}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative}
.card{padding:12px 12px 14px;border-radius:12px;color:#fff;display:flex;flex-direction:column;gap:3px;min-width:0;box-shadow:0 10px 24px rgba(0,0,0,.3)}
.card b{font:900 13px var(--display);opacity:.75}
.card strong{font:700 15px/1.15 var(--display);overflow-wrap:anywhere}
.card small{font-size:12px;opacity:.85}
.hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;opacity:.7;z-index:5;pointer-events:none}
.in>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.in>*:nth-child(2){animation-delay:.08s}.in>*:nth-child(3){animation-delay:.16s}.in>*:nth-child(4){animation-delay:.24s}.in>*:nth-child(5){animation-delay:.32s}.in>*:nth-child(6){animation-delay:.4s}
@keyframes rise{from{transform:translateY(18px);opacity:.001}to{transform:none;opacity:1}}
.in .blob{animation:pop .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{transform:scale(.4)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.in>*,.in .blob,.spin{animation:none}}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;position:relative}
.split i{display:block;height:100%}.split i:last-child{flex:1}
.splitlab{display:flex;justify-content:space-between;font-size:14px;margin-top:-8px;position:relative}
.word{font-family:var(--display);font-size:22px}
.emos{display:flex;flex-wrap:wrap;gap:14px 18px;position:relative}
.emos div{display:flex;flex-direction:column;align-items:center;gap:4px}
.emos span{font-size:clamp(38px,11vw,50px);line-height:1}
.emos small{font:700 13px var(--body);font-variant-numeric:tabular-nums;opacity:.85}
</style>

<div class="stage">
  <div class="phone" id="phone" aria-live="polite">
    <div class="bars" id="bars"></div>
    <div class="top"><span id="brand"></span><button id="pause" type="button" aria-label="Pause">Pause</button></div>
    <div id="slides"></div>
    <div class="tap l" id="prev" aria-hidden="true"></div>
    <div class="tap r" id="next" aria-hidden="true"></div>
    <div class="hint" id="hint">Tap right for next · left to go back</div>
  </div>
</div>

/* ===================================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const fmt = n => Number(n).toLocaleString("en-US");
const W = WRAPPED, [A, B] = W.names;
const days = Math.max(0, Math.floor((Date.now() - new Date(W.startDate + "T00:00:00")) / 864e5));
const talking = Math.max(0, Math.floor((Date.now() - new Date(W.talkingSince + "T00:00:00")) / 864e5));
const pct = (a,b) => Math.round(100*a/(a+b));

function blob(color, size, x, y){ return `<div class="blob" style="background:${color};width:${size}px;height:${size}px;left:${x};top:${y}"></div>`; }
function split(her, him, c1, c2){
  return `<div class="split" role="img" aria-label="${esc(B)} ${fmt(her)}, ${esc(A)} ${fmt(him)}"><i style="width:${pct(her,him)}%;background:${c1}"></i><i style="background:${c2}"></i></div>
  <div class="splitlab"><span>${esc(B)} <b>${fmt(her)}</b></span><span>${esc(A)} <b>${fmt(him)}</b></span></div>`;
}

const slides = [
  { bg:"var(--plum)", fg:"var(--cream)", html:`
    ${blob("var(--rose)",360,"-120px","-90px")}${blob("var(--tangerine)",220,"55%","70%")}
    <div class="kick">${W.year} Wrapped</div>
    <h1>${esc(A)}<br>+ ${esc(B)}</h1>
    ${W.photo ? `<img class="photo" src="${W.photo}" alt="${esc(A)} and ${esc(B)}">` : ""}
    <p>A year of us, in numbers, stickers and late-night messages. Tap to start.</p>` },

  { bg:"var(--tangerine)", fg:"var(--ink)", html:`
    ${blob("var(--butter)",300,"40%","-80px")}
    <div class="kick">We've been ${esc(W.startLabel)} for</div>
    <div class="big" data-count="${days}">0</div>
    <h2>days.</h2>
    <p class="sub">And ${fmt(talking)} days since the first message:<br><strong>"${esc(W.firstLine)}"</strong></p>` },

  { bg:"var(--blush)", fg:"var(--ink)", html:`
    ${blob("var(--rose)",200,"70%","-40px")}
    <div class="kick">Messages sent</div>
    <div class="big" data-count="${W.messages.total}">0</div>
    ${split(W.messages.her, W.messages.him, "var(--rose)", "var(--plum)")}
    <p class="sub">${esc(A)} sent more messages. ${esc(B)} wrote more words: ${fmt(W.words.her)} to his ${fmt(W.words.him)}.</p>` },

  { bg:"var(--butter)", fg:"var(--ink)", html:`
    ${blob("var(--tangerine)",260,"58%","68%")}
    <div class="kick">The sticker collection</div>
    <div class="big" data-count="${W.stickers.total}">0</div>
    <h2>stickers exchanged.</h2>
    ${split(W.stickers.her, W.stickers.him, "var(--tangerine)", "var(--ink)")}
    <p class="sub">On Instagram she said she missed her WhatsApp stickers. Two days later he showed up for the collection.</p>` },

  { bg:"var(--cobalt)", fg:"var(--cream)", html:`
    ${blob("var(--tangerine)",240,"62%","-70px")}
    <div class="kick">Reels and posts sent</div>
    <div class="big" data-count="${W.reels.total}">0</div>
    ${split(W.reels.her, W.reels.him, "var(--butter)", "var(--blush)")}
    <p class="sub">"Did you see the reel I sent?"</p>` },

  { bg:"var(--ink)", fg:"var(--cream)", html:`
    ${blob("var(--cobalt)",380,"-150px","50%")}
    <div class="kick">Night owls</div>
    <div class="big" data-count="${W.afterMidnight}">0</div>
    <h2>messages sent between midnight and 5 a.m.</h2>

    <h2>minutes of each other's voice. About ${fmt(Math.round(W.calls.perDay*W.calls.ldrDays/60))} hours.</h2>` },

  { bg:"var(--cream)", fg:"var(--plum)", html:`

    <p>And <strong>"hehe"</strong> in every length: ${fmt(W.hehe.total)} times. ${esc(A)} is responsible for ${fmt(W.hehe.him)} of them.</p>` },

  { bg:"var(--plum)", fg:"var(--cream)", html:`

    <div class="emos">${W.topEmojis.map((e,i)=>`<div><span>${e[0]}</span><small>${fmt(e[1])}</small></div>`).join("")}</div>
    <p class="sub">The red heart alone: ${fmt(W.topEmojis[0][1])} times.</p>` },

    <h2>"love you"s.</h2>
    <p>Plus ${fmt(W.missYou)} "miss you"s. ${esc(A)} said sorry ${fmt(W.sorry.him)} times, ${esc(B)} ${fmt(W.sorry.her)}. Make of that what you will.</p>` },

  { bg:"var(--tangerine)", fg:"var(--ink)", html:`
    ${blob("var(--rose)",280,"-100px","-60px")}

    <h2>out of ${fmt(W.daysTotal)}. Almost every single day.</h2>
    <p class="sub">Busiest day: ${esc(W.busiestDay.date)}, with ${fmt(W.busiestDay.count)} messages. ${esc(A)} texted first on ${fmt(W.textedFirst.him)} days, ${esc(B)} on ${fmt(W.textedFirst.her)}.</p>` },

  { bg:"var(--ink)", fg:"var(--cream)", html:`

    <h2>${esc(W.topSongs[0].title)}</h2>
    <p class="sub">${[W.topSongs[0].artist, W.songNote].filter(Boolean).map(esc).join(" · ")}</p>` },

  { bg:"var(--ink)", fg:"var(--cream)", cls:"collage", html:`
    ${W.photo ? `<img class="bgphoto" src="${W.photo}" alt="">` : ""}
    <div class="veil"></div>
    <div class="kick">Our songs</div>
    <div class="cards">${W.topSongs.slice(0,4).map((s,i)=>`<div class="card" style="background:${s.color||"var(--plum)"}"><b>${i+1}</b><strong>${esc(s.title)}</strong>${s.artist ? `<small>${esc(s.artist)}</small>` : ""}</div>`).join("")}</div>` },

  { bg:"var(--rose)", fg:"var(--cream)", html:`
    ${blob("var(--plum)",300,"45%","-100px")}

      <div><em>Messages</em><strong>${fmt(W.messages.total)}</strong></div>
      <div><em>Days we talked</em><strong>${fmt(W.daysTalked)}</strong></div>
      <div><em>Minutes on call</em><strong>${fmt(W.calls.perDay*W.calls.ldrDays)}</strong></div>
      <div><em>Love yous</em><strong>${fmt(W.loveYou.total)}</strong></div>
      <div><em>Top emoji</em><strong>${W.topEmojis[0][0]}</strong></div>
      <div class="wide"><em>Top song</em><strong>${esc(W.topSongs[0].title)}</strong></div>

    </div>
    <p class="sub">Screenshot this one. Tap left to go back.</p>` }

const box = $("#slides"), bars = $("#bars");
slides.forEach((s,i)=>{
  const el = document.createElement("section");
  el.className = "slide " + (s.cls || ""); el.style.background = s.bg; el.style.color = s.fg;
  el.innerHTML = s.html; el.hidden = i !== 0; box.appendChild(el);
  bars.insertAdjacentHTML("beforeend", `<div class="bar"><i></i></div>`);
});
$("#brand").textContent = `${A} + ${B}`;
const els = [...box.children], barEls = [...bars.children];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let cur = 0, start = 0, elapsed = 0, paused = false, raf;

function countUp(el){
  const target = +el.dataset.count;
  if (reduce) { el.textContent = fmt(target); return; }
  const t0 = performance.now(), d = 1400;
  (function step(t){ const p = Math.min(1,(t-t0)/d); el.textContent = fmt(Math.round(target*(1-Math.pow(1-p,3)))); if(p<1) requestAnimationFrame(step); })(t0);
}
function show(i){
  cur = Math.max(0, Math.min(slides.length-1, i));
  els.forEach((el,k)=>{ el.hidden = k!==cur; el.classList.toggle("in", k===cur); });
  barEls.forEach((b,k)=>{ b.classList.toggle("done", k<cur); b.firstChild.style.width = k<cur ? "100%" : "0"; });
  const s = els[cur], fg = s.style.color;
  document.querySelector(".top").style.color = fg;
  barEls.forEach(b=>{ b.style.background = "color-mix(in srgb, "+fg+" 30%, transparent)"; b.firstChild.style.background = fg; });
  $("#hint").style.color = fg;
  $("#hint").hidden = cur !== 0;
  s.querySelectorAll("[data-count]").forEach(countUp);
  elapsed = 0; start = performance.now();
}
function tick(t){
  const dur = (W.secondsPerSlide||0)*1000;
  if (dur && !paused){
    const p = Math.min(1, (elapsed + t - start)/dur);
    barEls[cur].firstChild.style.width = (p*100)+"%";
    if (p>=1 && cur < slides.length-1) show(cur+1);
  }
  raf = requestAnimationFrame(tick);
}
function setPaused(v){
  if (v === paused) return;
  if (v) elapsed += performance.now() - start; else start = performance.now();
  paused = v; $("#pause").textContent = v ? "Play" : "Pause"; $("#pause").setAttribute("aria-label", v ? "Play" : "Pause");
}
$("#next").addEventListener("click", ()=>show(cur+1));
$("#prev").addEventListener("click", ()=>show(cur-1));
$("#pause").addEventListener("click", e=>{ e.stopPropagation(); setPaused(!paused); });
document.addEventListener("keydown", e=>{
  if (e.key==="ArrowRight"||e.key===" ") { e.preventDefault(); show(cur+1); }
  if (e.key==="ArrowLeft") show(cur-1);
});
if (W.showEditHint) $("#hint").textContent = "Example data: edit the WRAPPED block in the file";
if (!W.secondsPerSlide) $("#pause").hidden = true;
show(0); raf = requestAnimationFrame(tick);
</script>
